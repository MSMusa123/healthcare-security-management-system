<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HSMS | Patients</title>

</head>

<body>

    <h1>Patient Records</h1>

    <p>
        Welcome, {{ full_name }}
    </p>

    <p>
        Role: {{ role }}
    </p>

    <hr>

    {% if patients %}

        {% for patient in patients %}

            <div>

                <h3>
                    {{ patient["patient_number"] }}
                </h3>

                <p>
                    Name: {{ patient["full_name"] }}
                </p>

                <p>
                    Ward: {{ patient["ward"] }}
                </p>

                <a href="/patient/{{ patient['id'] }}">
                    View Patient
                </a>

            </div>

            <hr>

        {% endfor %}

    {% else %}

        <p>No patients found.</p>

    {% endif %}

    <a href="/dashboard">
        Back to Dashboard
    </a>

</body>

</html>
